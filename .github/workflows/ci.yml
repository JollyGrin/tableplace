name: CI

on:
  pull_request:
  push:
    branches: 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # full history: the version-bump check diffs the schemas against the base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # The published contract (static/{pack,scenario}.schema.json, llms.txt) is
      # generated from the TypeScript types. Fails if regeneration produces
      # different content than what is committed, or if a schema's content
      # changed without x-tableplace-spec-version being bumped.
      - name: Published contract is current and versioned
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          if [ -n "$BASE" ]; then
            bun run schemas:check --base "$BASE"
          else
            bun run schemas:check
          fi

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # The headless render harness. Separate job because it needs Go (for the
  # relay) and a real browser, and because it is the only thing here that
  # executes three.js: jsdom never runs a raycast or a WebGL draw, which is how
  # #102 shipped past 700 green unit tests, a clean svelte-check and a clean
  # build. Anything that only breaks in a real browser breaks here.
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: bun install

      # Chrome ships on the GitHub-hosted ubuntu images; puppeteer-core
      # downloads nothing. The harness starts its own vite dev server on a
      # random high port and its own Go relay, and never talks to the public
      # api.table.place.
      - name: Headless render harness
        run: bun run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # The ceiling for one table load (goto, then the bridge's ready flag),
          # not the time a load is expected to take. A lone, uncontended load
          # measured 33–57 s on a 16 GB VPS, and the cold first one was the
          # slowest. The 60 s default leaves no headroom for a shared runner.
          # Second-seat loads never hit this ceiling since #243, because
          # openTable freezes the other pages while it loads.
          E2E_READY_MS: '120000'

      # One PNG per spec (e2e/table.ts `snap`): the visual-polish train's
      # before/after evidence. Uploaded even when the harness fails — the
      # screenshots that did get written are exactly what a failure needs.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
